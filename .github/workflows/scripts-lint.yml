name: shell-lint
on:
  push:
    paths: ['build/*.sh', '.github/workflows/scripts-lint.yml']
  pull_request:
    paths: ['build/*.sh', '.github/workflows/scripts-lint.yml']
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in build/*.sh; do bash -n "$f"; done
      - run: shellcheck -S warning build/*.sh
